name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install lightweight test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Compile Python sources
        run: python -m compileall -q train_cyber_lora.py cyber_lora_utils.py scripts tests
      - name: Validate notebook JSON and structure
        run: python scripts/validate_notebook.py SecurityMaxx.ipynb
      - name: Run synthetic unit tests
        run: python -m pytest -q
      - name: Validate experiment and scope YAML
        run: python -c "import yaml; [yaml.safe_load(open(p, encoding='utf-8')) for p in ['configs/experiment.yaml', 'configs/scope_filter.yaml']]"
